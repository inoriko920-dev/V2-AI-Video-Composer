name: Historical Generate V2 Planning DOCX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install DOCX dependency
        run: python -m pip install "python-docx==1.2.0"

      - name: Generate planning DOCX
        run: python docs/v2_planning/_generator/generate_v2_planning_docs.py

      - name: Verify expected planning files
        shell: bash
        run: |
          test "$(find docs/v2_planning -maxdepth 1 -type f -name 'STEP_*_V2_*.docx' | wc -l)" -eq 14
          test -f docs/v2_planning/V2_MASTER_PLANNING_INDEX.docx

      - name: Upload generated planning documents
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: V2-historical-planning-DOCX
          path: |
            docs/v2_planning/STEP_*_V2_*.docx
            docs/v2_planning/V2_MASTER_PLANNING_INDEX.docx
          if-no-files-found: error
          retention-days: 30
