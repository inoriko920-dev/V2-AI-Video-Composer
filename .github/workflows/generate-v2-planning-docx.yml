name: Generate V2 Planning DOCX

on:
  push:
    branches:
      - main
    paths:
      - "docs/v2_planning/_generator/**"
      - ".github/workflows/generate-v2-planning-docx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DOCX dependency
        run: python -m pip install "python-docx==1.2.0"

      - name: Generate planning DOCX
        run: python docs/v2_planning/_generator/generate_v2_planning_docs.py

      - name: Verify expected planning files
        shell: bash
        run: |
          test "$(find docs/v2_planning -maxdepth 1 -type f -name 'STEP_*_V2_*.docx' | wc -l)" -eq 14
          test -f docs/v2_planning/V2_MASTER_PLANNING_INDEX.docx

      - name: Commit generated planning documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_planning/*.docx
          if git diff --cached --quiet; then
            echo "Planning DOCX already up to date."
            exit 0
          fi
          git commit -m "docs(v2): generate planning DOCX source of truth"
          git push
