name: V2 0.3.0 Release Candidate Verification (NO PUBLISH)

on:
  push:
    branches:
      - release/v0.3.0-rc-preparation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-030-rc-validation
  cancel-in-progress: true

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Validate version and immutable published v0.2.2
        shell: pwsh
        run: |
          if ((Select-String -Path pyproject.toml -Pattern '^version = "0.3.0"$').Count -ne 1) { throw "Expected 0.3.0 package" }
          if ((Select-String -Path src/aavc/__init__.py -Pattern '^__version__ = "0.3.0"$').Count -ne 1) { throw "Expected 0.3.0 runtime" }
          $old = (git rev-parse "refs/tags/v0.2.2^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $old -ne "eeabf1ffbfac6cbb6cafc82116fc3599bdbc2bef") {
            throw "Published v0.2.2 tag is not immutable"
          }
          $existing = @(git tag --list "v0.3.0")
          if ($existing -contains "v0.3.0") { throw "Stable v0.3.0 tag exists: abort RC" }

      - name: Reject committed secrets
        run: python scripts/check_no_secrets.py

      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip check

      - name: Enforce reviewed external FFmpeg 9.0.2
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg reference install failed" }
          }
          ./scripts/verify_ffmpeg_reference.ps1 -Mode system

      - name: Verify pinned package runtime metadata
        shell: pwsh
        run: |
          $installed = (python -c "from importlib.metadata import version; print(version('ai-automatic-video-composer'))").Trim()
          $runtime = (python -c "from aavc import __version__; print(__version__)").Trim()
          if ($installed -ne "0.3.0" -or $runtime -ne "0.3.0") {
            throw "RC version mismatch installed=$installed runtime=$runtime"
          }

      - name: Compile Ruff and strict mypy
        run: |
          python -m compileall -q src
          python -m ruff check src tests
          python -m mypy src/aavc

      - name: Full nonvisual regression tests
        run: python -m pytest -m "not visual" -q

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable EXE and files
        shell: pwsh
        run: ./scripts/verify_portable.ps1

      - name: Verify portable five-path matrix
        shell: pwsh
        run: ./scripts/verify_v2_0_3_0_portable_paths.ps1

      - name: Launch packaged EXE and capture real UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force artifacts/rc030 | Out-Null
          $exe = Resolve-Path "dist/AI Automatic Video Composer/AI Automatic Video Composer.exe"
          $out = Join-Path (Resolve-Path "artifacts/rc030") "PACKAGED_UI_002.png"
          $process = Start-Process -FilePath $exe -ArgumentList @("--ui-state", "UI-002", "--capture-path", ('"' + $out + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged UI launch failed" }
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) { throw "Real screenshot missing" }

      - name: Verify portable FFmpeg PATH and app-local precedence
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: ./scripts/verify_ffmpeg_reference.ps1 -Mode both

      - name: Build exact-source checksum-verified RC (not released)
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: ./scripts/build_v2_0_3_0_candidate.ps1 -Channel rc

      - name: Verify candidate source SHA and SHA256SUMS
        shell: pwsh
        run: |
          $bundle = "release_candidate_0_3_0"
          $info = Get-Content "$bundle/BUILD_INFO.txt" -Raw
          $expected = (git rev-parse HEAD).Trim()
          if (-not $info.Contains("release_commit=$expected")) { throw "Candidate source SHA mismatch" }
          if (-not $info.Contains("version=0.3.0") -or -not $info.Contains("publication_status=NOT_PUBLISHED")) {
            throw "Invalid candidate version or publication state"
          }
          foreach ($line in Get-Content "$bundle/SHA256SUMS.txt") {
            $parts = $line.Trim() -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Invalid checksum record" }
            $actual = (Get-FileHash (Join-Path $bundle $parts[1]) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $parts[0]) { throw "Candidate checksum mismatch" }
          }
          "RC_VERSION=0.3.0" | Set-Content artifacts/rc030/RC_STATUS.txt
          "RC_SOURCE_SHA=$expected" | Add-Content artifacts/rc030/RC_STATUS.txt
          "PUBLICATION_STATUS=NOT_PUBLISHED" | Add-Content artifacts/rc030/RC_STATUS.txt
          Copy-Item "artifacts/v030_path_matrix/SPECIAL_PATH_MATRIX.txt" "artifacts/rc030/SPECIAL_PATH_MATRIX.txt"

      - name: Upload non-published Windows/source candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-0.3.0-RC-NOT-PUBLISHED
          path: |
            release_candidate_0_3_0/*
            artifacts/rc030/*
          if-no-files-found: error
          retention-days: 14
