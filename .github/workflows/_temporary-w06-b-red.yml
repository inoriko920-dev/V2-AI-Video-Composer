name: Temporary W06-B RED evidence
on:
  push:
    branches:
      - v2/0.3.0-w06-b-snapshot-provenance
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==9.1.1"
      - name: Capture test-first RED, no provenance module exists
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit/test_v2_0_3_0_w06_b_snapshot_provenance.py
