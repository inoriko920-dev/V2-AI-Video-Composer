name: One-shot V2 0.3.0 STEP02 Detailed DOCX

on:
  push:
    branches: [v2/0.3.0-planning-step02]
    paths: [.github/workflows/v2-0.3.0-step02-docx-once.yml]

permissions:
  contents: write

concurrency:
  group: v2-0-3-0-step02-docx-once
  cancel-in-progress: false

jobs:
  docx:
    if: github.repository == 'inoriko920-dev/V2-AI-Video-Composer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exact planning branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v2/0.3.0-planning-step02
          persist-credentials: true
          fetch-depth: 0
      - name: Enforce planning-only path
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/v2/0.3.0-planning-step02
          test "$(git symbolic-ref --short HEAD)" = v2/0.3.0-planning-step02
          test -s docs/v2_0_3_0_planning/02_RECOVERY_ARCHITECTURE_ATOMICITY_SCHEDULER_PLAN.md
          test -s docs/v2_0_3_0_planning/_generator/generate_step02_docx.py
          test ! -f docs/v2_0_3_0_planning/docx/02_V2_0.3.0_RECOVERY_ARCHITECTURE_ATOMICITY_SCHEDULER_PLAN.docx
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Generate and structurally audit Word artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python docs/v2_0_3_0_planning/_generator/generate_step02_docx.py
          WORD=docs/v2_0_3_0_planning/docx/02_V2_0.3.0_RECOVERY_ARCHITECTURE_ATOMICITY_SCHEDULER_PLAN.docx
          test -s "$WORD"
          unzip -t "$WORD" | tail -n 2
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          p=Path('docs/v2_0_3_0_planning/docx/02_V2_0.3.0_RECOVERY_ARCHITECTURE_ATOMICITY_SCHEDULER_PLAN.docx')
          d=Document(p)
          assert len(d.paragraphs)>=70, len(d.paragraphs)
          assert len(d.tables)>=6, len(d.tables)
          t="\n".join(x.text for x in d.paragraphs)
          for term in ("STEP 02", "SnapshotProvenanceStore", "STEP03", "120 seconds"):
              assert term in t, term
          print("STEP02_DOCX_STRUCTURE_PASS", len(d.paragraphs),len(d.tables),p.stat().st_size)
          PY
          sha256sum "$WORD"
      - name: Upload full DOCX for independent visual QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: V2-0.3.0-STEP02-DOCX-VISUAL-QA
          path: docs/v2_0_3_0_planning/docx/02_V2_0.3.0_RECOVERY_ARCHITECTURE_ATOMICITY_SCHEDULER_PLAN.docx
          retention-days: 5
          if-no-files-found: error
      - name: Commit ONLY DOCX and delete this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = v2/0.3.0-planning-step02
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORD=docs/v2_0_3_0_planning/docx/02_V2_0.3.0_RECOVERY_ARCHITECTURE_ATOMICITY_SCHEDULER_PLAN.docx
          git add "$WORD"
          git rm .github/workflows/v2-0.3.0-step02-docx-once.yml
          git diff --cached --name-only | grep -Fx "$WORD"
          git diff --cached --name-only | grep -Fx .github/workflows/v2-0.3.0-step02-docx-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'docs(v0.3.0): commit STEP02 architecture Word and self-retire generator'
          git push origin HEAD:refs/heads/v2/0.3.0-planning-step02
