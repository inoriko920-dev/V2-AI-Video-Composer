name: V031 STEP00 native DOCX staging (one-time, remove before merge)
on:
  push:
    branches:
      - plan/v0.3.1-step00-readiness-20261008
    paths:
      - .github/workflows/_v031-step00-docx-staging-once.yml
      - docs/v2_0_3_1_planning/_GENERATE_STEP00_DOCX_TEMP.py
permissions:
  contents: write
jobs:
  generate-plan-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build DOCX from the committed planning source
        run: |
          python -m pip install "python-docx==1.2.0"
          python docs/v2_0_3_1_planning/_GENERATE_STEP00_DOCX_TEMP.py
      - name: Commit only generated native DOCX to this planning branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/v2_0_3_1_planning/docx/00_ASTRA_V031_DELTA_AUDIT_RELEASE_READINESS_PLAN.docx
          git diff --cached --quiet && exit 1
          git commit -m "docs(v0.3.1): stage native STEP00 DOCX"
          git push origin HEAD:refs/heads/plan/v0.3.1-step00-readiness-20261008
