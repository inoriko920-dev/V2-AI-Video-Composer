name: One-shot V2 0.3.0 STEP00 Refined DOCX branch-only

on:
  push:
    branches:
      - v2/0.3.0-planning-step00
    paths:
      - .github/workflows/v2-0.3.0-step00-docx-refine-once.yml

permissions:
  contents: write

concurrency:
  group: v2-0-3-0-step00-docx-refine-once
  cancel-in-progress: false

jobs:
  regenerate-and-self-retire:
    if: github.repository == 'inoriko920-dev/V2-AI-Video-Composer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v2/0.3.0-planning-step00
          persist-credentials: true
          fetch-depth: 0
      - name: Enforce exact planning branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/v2/0.3.0-planning-step00"
          test "$(git symbolic-ref --short HEAD)" = "v2/0.3.0-planning-step00"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Regenerate refined DOCX with source-of-truth Markdown
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python docs/v2_0_3_0_planning/_generator/generate_step00_docx.py
          DOCX=docs/v2_0_3_0_planning/docx/00_V2_0.3.0_PRODUCT_GAP_AUDIT_AND_RECOVERY_SCOPE.docx
          test -s "$DOCX"
          unzip -t "$DOCX" | tail -n 2
          sha256sum "$DOCX"
      - name: Export refined DOCX for independent visual QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: V2-0.3.0-STEP00-FINAL-DOCX-QA
          path: docs/v2_0_3_0_planning/docx/00_V2_0.3.0_PRODUCT_GAP_AUDIT_AND_RECOVERY_SCOPE.docx
          if-no-files-found: error
          retention-days: 3
      - name: Commit only DOCX and remove ephemeral workflow from planning branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = "v2/0.3.0-planning-step00"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_0_3_0_planning/docx/00_V2_0.3.0_PRODUCT_GAP_AUDIT_AND_RECOVERY_SCOPE.docx
          git rm .github/workflows/v2-0.3.0-step00-docx-refine-once.yml
          git diff --cached --name-only | grep -Fx ".github/workflows/v2-0.3.0-step00-docx-refine-once.yml"
          git diff --cached --name-only | grep -Fx "docs/v2_0_3_0_planning/docx/00_V2_0.3.0_PRODUCT_GAP_AUDIT_AND_RECOVERY_SCOPE.docx"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "docs(v2): polish and replace STEP00 DOCX; remove branch-only workflow"
          git push origin HEAD:refs/heads/v2/0.3.0-planning-step00
