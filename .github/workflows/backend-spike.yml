name: Optional Backend Spike

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pyav-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: 'pip'
      - name: Install isolated PyAV wheel
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install --only-binary=:all: "av==19.0.1"
          python -m pip check
      - name: Run PyAV dependency spike
        run: python spikes/pyav/verify_pyav.py --output artifacts/pyav_spike.json
      - name: Upload PyAV spike evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wave-i-pyav-windows-spike
          path: artifacts/pyav_spike.json
          if-no-files-found: error
