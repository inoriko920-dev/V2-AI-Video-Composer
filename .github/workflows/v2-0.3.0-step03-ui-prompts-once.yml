name: One-shot V2 0.3.0 STEP03 UI Prompt Package

on:
  push:
    branches:
      - v2/0.3.0-step03-ui-prompt-hard-stop
    paths:
      - .github/workflows/v2-0.3.0-step03-ui-prompts-once.yml

permissions:
  contents: write

concurrency:
  group: v2-0-3-0-step03-ui-prompt-only
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'inoriko920-dev/V2-AI-Video-Composer'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Exact planning branch checkout only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v2/0.3.0-step03-ui-prompt-hard-stop
          persist-credentials: true
          fetch-depth: 0
      - name: Verify scope and absent UI images
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/v2/0.3.0-step03-ui-prompt-hard-stop"
          test "$(git symbolic-ref --short HEAD)" = v2/0.3.0-step03-ui-prompt-hard-stop
          test -s docs/v2_0_3_0_planning/03_PROMPT_GAMBAR_UI_RECOVERY_MASTER.md
          test -s docs/v2_0_3_0_planning/_generator/generate_step03_prompt_docs.py
          test ! -d docs/v2_0_3_0_planning/prompt_ui_step03
          test ! -e docs/v2_0_3_0_planning/docx/03_V2_0.3.0_STEP03_UI_IMAGE_PROMPTS_ONLY.docx
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Generate 13 independently usable TXT prompts plus complete DOCX
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "python-docx==1.2.0"
          python docs/v2_0_3_0_planning/_generator/generate_step03_prompt_docs.py
          BASE=docs/v2_0_3_0_planning
          WORD=$BASE/docx/03_V2_0.3.0_STEP03_UI_IMAGE_PROMPTS_ONLY.docx
          test -s "$WORD"
          unzip -t "$WORD" | tail -n 2
          test "$(find "$BASE/prompt_ui_step03" -name '*.txt' | wc -l)" -eq 13
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          b=Path('docs/v2_0_3_0_planning')
          doc=Document(b/'docx/03_V2_0.3.0_STEP03_UI_IMAGE_PROMPTS_ONLY.docx')
          assert len(doc.paragraphs)>=55, len(doc.paragraphs)
          assert len(doc.tables)>=2, len(doc.tables)
          data="\n".join(p.text for p in doc.paragraphs) + "\n".join(cell.text for t in doc.tables for row in t.rows for cell in row.cells)
          for n in range(1,14):
              ident=f'UI-REC-{n:02d}'
              assert ident in data, ident
              txt=list((b/'prompt_ui_step03').glob(f'{ident}_*.txt'))
              assert len(txt)==1, (ident,txt)
              text=txt[0].read_text(encoding='utf-8')
              assert 'A. MASTER DESIGN' in text and 'C. UNIQUE IMAGE STATE' in text and 'HARD STOP' in text
              assert len(text)>900, (ident,len(text))
          print('STEP03_13_TXT_DOCX_STRUCTURAL_PASS',len(doc.paragraphs),len(doc.tables))
          PY
          sha256sum "$WORD"
          find "$BASE/prompt_ui_step03" -name '*.txt' -print | sort
      - name: Upload non-published prompt bundle for visual DOCX QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: V2-0.3.0-STEP03-13-TXT-and-DOCX-PROMPTS-ONLY
          path: |
            docs/v2_0_3_0_planning/docx/03_V2_0.3.0_STEP03_UI_IMAGE_PROMPTS_ONLY.docx
            docs/v2_0_3_0_planning/prompt_ui_step03/*.txt
          retention-days: 5
          if-no-files-found: error
      - name: Commit only planning deliverables then self-retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = v2/0.3.0-step03-ui-prompt-hard-stop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_0_3_0_planning/prompt_ui_step03/*.txt
          git add docs/v2_0_3_0_planning/docx/03_V2_0.3.0_STEP03_UI_IMAGE_PROMPTS_ONLY.docx
          git rm .github/workflows/v2-0.3.0-step03-ui-prompts-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 15
          test "$(git diff --cached --name-only | grep -c 'docs/v2_0_3_0_planning/prompt_ui_step03/.*\.txt')" -eq 13
          git commit -m 'docs(v0.3.0): commit 13 UI image prompts and Word; self-retire generator'
          git push origin HEAD:refs/heads/v2/0.3.0-step03-ui-prompt-hard-stop
