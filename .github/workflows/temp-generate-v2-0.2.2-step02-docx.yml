name: TEMP Generate V2 0.2.2 STEP02 DOCX

on:
  push:
    branches:
      - v2/0.2.2-step02-lifecycle-plan
    paths:
      - "docs/v2_0_2_2_planning/_generator/generate_step02_docx.py"
      - ".github/workflows/temp-generate-v2-0.2.2-step02-docx.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install DOCX dependency
        run: python -m pip install "python-docx==1.2.0"
      - name: Generate STEP 02 DOCX
        run: python docs/v2_0_2_2_planning/_generator/generate_step02_docx.py
      - name: Commit STEP 02 DOCX
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/v2_0_2_2_planning/docx/02_V2_0.2.2_ADVANCED_EDITOR_LIFECYCLE_REGRESSION_PLAN.docx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_0_2_2_planning/docx/02_V2_0.2.2_ADVANCED_EDITOR_LIFECYCLE_REGRESSION_PLAN.docx
          git commit -m "docs(v2): generate 0.2.2 STEP 02 DOCX"
          git push origin HEAD:v2/0.2.2-step02-lifecycle-plan
