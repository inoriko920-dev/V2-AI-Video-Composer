name: One-shot V2 0.3.0 STEP00 DOCX Quality Transfer

on:
  push:
    branches:
      - v2/0.3.0-planning-step00
    paths:
      - .github/workflows/v2-0.3.0-step00-docx-review.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read planning branch without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v2/0.3.0-planning-step00
          persist-credentials: false
      - name: Validate docx path
        shell: bash
        run: |
          set -euo pipefail
          FILE="docs/v2_0_3_0_planning/docx/00_V2_0.3.0_PRODUCT_GAP_AUDIT_AND_RECOVERY_SCOPE.docx"
          test -s "$FILE"
          unzip -t "$FILE"
          sha256sum "$FILE"
      - name: Upload exact committed DOCX for independent visual QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: V2-0.3.0-STEP00-REVIEW-DOCX
          path: docs/v2_0_3_0_planning/docx/00_V2_0.3.0_PRODUCT_GAP_AUDIT_AND_RECOVERY_SCOPE.docx
          retention-days: 3
          if-no-files-found: error
