name: Generate V2 0.2.2 STEP00 DOCX

on:
  push:
    branches:
      - main
    paths:
      - "docs/v2_0_2_2_planning/00_POST_RELEASE_AUDIT_AND_SCOPE.md"
      - "docs/v2_0_2_2_planning/_generator/generate_step00_docx.py"
      - ".github/workflows/generate-v2-0.2.2-step00-docx.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install DOCX dependency
        run: python -m pip install "python-docx==1.2.0"

      - name: Generate STEP 00 DOCX
        run: python docs/v2_0_2_2_planning/_generator/generate_step00_docx.py

      - name: Verify generated DOCX
        shell: bash
        run: |
          test -s docs/v2_0_2_2_planning/docx/00_V2_0.2.2_POST_RELEASE_AUDIT_AND_SCOPE.docx

      - name: Commit generated DOCX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_0_2_2_planning/docx/00_V2_0.2.2_POST_RELEASE_AUDIT_AND_SCOPE.docx
          if git diff --cached --quiet; then
            echo "STEP00 DOCX already up to date."
            exit 0
          fi
          git commit -m "docs(v2): generate 0.2.2 STEP 00 DOCX"
          git pull --rebase origin main
          git push origin HEAD:main
