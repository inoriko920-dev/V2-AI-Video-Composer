name: Historical Generate V2 0.2.2 STEP00 DOCX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install DOCX dependency
        run: python -m pip install "python-docx==1.2.0"

      - name: Generate STEP 00 DOCX
        run: python docs/v2_0_2_2_planning/_generator/generate_step00_docx.py

      - name: Verify generated DOCX
        shell: bash
        run: test -s docs/v2_0_2_2_planning/docx/00_V2_0.2.2_POST_RELEASE_AUDIT_AND_SCOPE.docx

      - name: Upload generated DOCX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: V2-0.2.2-STEP00-DOCX
          path: docs/v2_0_2_2_planning/docx/00_V2_0.2.2_POST_RELEASE_AUDIT_AND_SCOPE.docx
          if-no-files-found: error
          retention-days: 30
