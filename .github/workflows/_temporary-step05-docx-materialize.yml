name: Temporary STEP05 Readiness DOCX Materialization
on:
  push:
    branches:
      - v2/0.3.0-step05-implementation-readiness
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout V2 planning branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v2/0.3.0-step05-implementation-readiness
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Word generator dependency
        run: python -m pip install 'python-docx==1.2.0'
      - name: Build final native STEP05 Word
        run: python docs/v2_0_3_0_planning/_generator/generate_step05_docx.py
      - name: Validate readiness DOCX and mandatory artifact references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from zipfile import ZipFile
          root=Path('docs/v2_0_3_0_planning')
          word=root/'docx/05_V2_0.3.0_IMPLEMENTATION_READINESS_AND_SOL_WAVE_PLAN.docx'
          source=root/'05_IMPLEMENTATION_READINESS_AND_SOL_WAVE_AUTHORIZATION_PLAN.md'
          assert word.is_file() and word.stat().st_size>35000,word
          with ZipFile(word) as z:
              assert z.testzip() is None
              assert 'word/document.xml' in z.namelist()
          d=Document(word)
          contents='\n'.join([p.text for p in d.paragraphs]+[c.text for t in d.tables for row in t.rows for c in row.cells])
          for label in ['STEP 05','W06-A','W06-B','W06-C','W06-D','W06-E',
                        'DOR-01','DOR-09','G-05-03B','RCV-01..24','SCH-01..12',
                        'AT-01..20','UI-01..12','COMP-01..10','HARD STOP']:
              assert label in contents and label in source.read_text('utf-8'),label
          assert len(d.tables)>=5,(len(d.tables),'missing tables')
          for p in ['00_V2_0.3.0_PRODUCT_GAP_AUDIT_AND_RECOVERY_SCOPE.docx',
                    '01_V2_0.3.0_AUTOSAVE_RECOVERY_FUNCTIONAL_LIFECYCLE_SPEC.docx',
                    '02_V2_0.3.0_RECOVERY_ARCHITECTURE_ATOMICITY_SCHEDULER_PLAN.docx',
                    '03_V2_0.3.0_FINAL_APPROVED_UI_DIALOG_REFERENCES.docx',
                    '04_V2_0.3.0_RECOVERY_FAILURE_INJECTION_WINDOWS_TEST_PLAN.docx']:
              assert (root/'docx'/p).is_file(),p
          for p in ['UI-013_ACTUAL_REFERENCE.png','UI-REC-DLG-01.png',
                    'UI-REC-DLG-02.png','UI-REC-DLG-03.png']:
              assert (root/'ui_step03_approved'/p).is_file(),p
          print('STEP05_WORD_DO_R_PASS', word.stat().st_size, 'tables',len(d.tables),'paragraphs',len(d.paragraphs))
          PY
      - name: Retire temporary transfer workflow
        shell: bash
        run: git rm -f .github/workflows/_temporary-step05-docx-materialize.yml
      - name: Commit actual Word file without any production changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v2_0_3_0_planning/docx/05_V2_0.3.0_IMPLEMENTATION_READINESS_AND_SOL_WAVE_PLAN.docx
          git diff --cached --name-status
          git commit -m 'docs(step05): commit actual implementation readiness Word; retire one-time workflow'
          git push origin HEAD:v2/0.3.0-step05-implementation-readiness
