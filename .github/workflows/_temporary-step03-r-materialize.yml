name: Temporary STEP03-R Approved UI Materialization
on:
  push:
    branches:
      - v2/0.3.0-step03-r-approved-ui-assets
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.head_commit.message == 'chore(step03-r): trigger approved UI asset materialization'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout V2 working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v2/0.3.0-step03-r-approved-ui-assets
          persist-credentials: true
      - name: Prepare Python and font dependency
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install render dependencies
        shell: bash
        run: |
          python -m pip install 'Pillow==11.3.0' 'python-docx==1.2.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          test -f /usr/share/fonts/opentype/inter/Inter-Regular.otf
      - name: Download authoritative original editor screenshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/step09"
          gh run download 37734080472 --repo inoriko920-dev/V2-AI-Video-Composer --name step09-ui-actual --dir "$RUNNER_TEMP/step09"
          original="$(find "$RUNNER_TEMP/step09" -type f -name 'UI-013_ACTUAL.png' -print -quit)"
          test -n "$original"
          sudo mkdir -p /mnt/data/step03_r_ui_source
          sudo chown -R "$USER:$USER" /mnt/data
          cp "$original" /mnt/data/step03_r_ui_source/UI-013_ACTUAL.png
          echo '729ee1fcdf40dc07ec9a1f399b1bc98f303960c72e7d700239b4cf9306fd630c  /mnt/data/step03_r_ui_source/UI-013_ACTUAL.png' | sha256sum --check
      - name: Reproduce approved PNG bytes from original editor screenshot
        shell: bash
        run: |
          python docs/v2_0_3_0_planning/_generator/_temporary_build_step03_approved_pngs.py
          cd /mnt/data/V2_AI_Video_Composer_STEP03_R_UI_DRAFT_REVIEW
          echo '3c8cae008c762f13539ba367dff332930993e4883f79d0411666bc465c1c9cf0  UI-REC-DLG-01.png' | sha256sum --check
          echo 'c0fe7738e2af1c1b45f0acbe54b3d2aef83f8eb90daeaa29bc5e01c7b3bd4d01  UI-REC-DLG-02.png' | sha256sum --check
          echo '84955b4cc9c2df8691905112c6fde8f7cde7599657836aed005b6a8840662cec  UI-REC-DLG-03.png' | sha256sum --check
      - name: Generate final real DOCX with three embedded approved PNGs
        shell: bash
        run: |
          python docs/v2_0_3_0_planning/_generator/_temporary_build_step03_approved_docx.py
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path('/mnt/data/03_V2_0.3.0_FINAL_APPROVED_UI_DIALOG_REFERENCES.docx')
          with ZipFile(p) as z:
              assert z.testzip() is None
              media=[x for x in z.namelist() if x.startswith('word/media/')]
              assert len(media)>=4,(len(media),media)
          print('DOCX embedded media verification: PASS', len(media), p.stat().st_size)
          PY
      - name: Materialize approved images and Word in documentation folders
        shell: bash
        run: |
          mkdir -p docs/v2_0_3_0_planning/ui_step03_approved docs/v2_0_3_0_planning/docx
          cp /mnt/data/V2_AI_Video_Composer_STEP03_R_UI_DRAFT_REVIEW/UI-REC-DLG-0{1,2,3}.png docs/v2_0_3_0_planning/ui_step03_approved/
          cp /mnt/data/V2_AI_Video_Composer_STEP03_R_UI_DRAFT_REVIEW/UI-013_ACTUAL_REFERENCE.png docs/v2_0_3_0_planning/ui_step03_approved/
          cp /mnt/data/03_V2_0.3.0_FINAL_APPROVED_UI_DIALOG_REFERENCES.docx docs/v2_0_3_0_planning/docx/
      - name: Record gate status while retaining STEP04 hard stop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('V2_0.3.0_PLANNING_STATUS.md')
          text=p.read_text('utf-8')
          heading=("# STEP03-R — USER APPROVED THREE UI DIALOGS; SOURCE ASSETS AND FINAL DOCX\n\n"
                   "Explicit approval recorded 8 Oktober 2026 WIB. Three 1920x1080 PNGs, original editor reference, "
                   "and one image-filled 7-page final UI DOCX were materialized and verified in a dedicated PR branch. "
                   "STEP03-R visual gate can be called PASS only after PR CI/CodeQL/backend/Windows gates and merge to main. "
                   "No STEP04 execution or SOL coding is authorized by this approval; a separate command is still required.\n\n---\n\n")
          if not text.startswith('# STEP03-R — USER APPROVED'):
              p.write_text(heading+text,encoding='utf-8')
          PY
      - name: Remove all temporary workflow and generator sources before PR
        shell: bash
        run: |
          git rm -f .github/workflows/_temporary-step03-r-materialize.yml
          git rm -f docs/v2_0_3_0_planning/_generator/_temporary_build_step03_approved_pngs.py
          git rm -f docs/v2_0_3_0_planning/_generator/_temporary_build_step03_approved_docx.py
      - name: Commit final docs-only assets and push the PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V2_0.3.0_PLANNING_STATUS.md docs/v2_0_3_0_planning/docx/03_V2_0.3.0_FINAL_APPROVED_UI_DIALOG_REFERENCES.docx docs/v2_0_3_0_planning/ui_step03_approved/ docs/v2_0_3_0_planning/03_STEP03_APPROVAL_RECORD.md
          git diff --cached --name-status
          git commit -m "docs(step03-r): commit three user-approved UI dialogs and final Word reference"
          git push origin HEAD:v2/0.3.0-step03-r-approved-ui-assets
