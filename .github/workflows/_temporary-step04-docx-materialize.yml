name: Temporary STEP04 Detailed DOCX Materialization
on:
  push:
    branches:
      - v2/0.3.0-step04-recovery-test-planning
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout V2 STEP04 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v2/0.3.0-step04-recovery-test-planning
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install document-only dependency
        run: python -m pip install "python-docx==1.2.0"
      - name: Generate STEP04 real Word document
        run: python docs/v2_0_3_0_planning/_generator/generate_step04_testing_docx.py
      - name: Validate Word XML, source matrix coverage and native file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from docx import Document
          root=Path('docs/v2_0_3_0_planning')
          p=root/'docx/04_V2_0.3.0_RECOVERY_FAILURE_INJECTION_WINDOWS_TEST_PLAN.docx'
          src=(root/'04_RECOVERY_FAILURE_INJECTION_WINDOWS_TEST_PLAN.md').read_text(encoding='utf-8')
          assert p.is_file() and p.stat().st_size>25000,p
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert 'word/document.xml' in z.namelist()
          doc=Document(p)
          body='\n'.join([x.text for x in doc.paragraphs]+[cell.text for t in doc.tables for row in t.rows for cell in row.cells])
          groups={'RCV-':24,'SCH-':12,'AT-':20,'UI-':12,'COMP-':10}
          for prefix,count in groups.items():
              for i in range(1,count+1):
                  label=f'{prefix}{i:02d}'
                  assert label in src and label in body,label
          assert len(doc.tables)>=8,len(doc.tables)
          assert 'NO CODING' in body or 'Belum ada test baru' in body
          print('STEP04 Word DOCX PASS',p.stat().st_size,'bytes',len(doc.tables),'tables',len(doc.paragraphs),'paragraphs')
          PY
      - name: Remove this branch-only transfer workflow
        shell: bash
        run: git rm -f .github/workflows/_temporary-step04-docx-materialize.yml
      - name: Commit actual DOCX and retire workflow before PR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_0_3_0_planning/docx/04_V2_0.3.0_RECOVERY_FAILURE_INJECTION_WINDOWS_TEST_PLAN.docx
          git diff --cached --name-status
          git commit -m "docs(step04): commit native detailed testing DOCX and retire temporary workflow"
          git push origin HEAD:v2/0.3.0-step04-recovery-test-planning
