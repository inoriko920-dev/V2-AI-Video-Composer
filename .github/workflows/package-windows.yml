name: Package Windows Foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: 'pip'
      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Verify dependency graph
        run: python -m pip check
      - name: Build onedir
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Archive portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath "AAVC-foundation-win64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-foundation-win64
          path: AAVC-foundation-win64.zip
          if-no-files-found: error
