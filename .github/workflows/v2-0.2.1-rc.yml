name: V2 0.2.1 RC Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: v2-0.2.1-rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rc-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact RC source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record source identity
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          Write-Host "RC source commit: $commit"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $expected = "${{ github.event.pull_request.head.sha }}"
            if ($commit -ne $expected) {
              throw "RC checkout mismatch: expected PR head $expected, got $commit"
            }
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: 'pip'

      - name: Reject committed secrets
        run: python scripts/check_no_secrets.py

      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Verify dependency graph
        run: python -m pip check

      - name: Verify RC version
        shell: pwsh
        run: |
          $runtime = (python -c "from aavc import __version__; print(__version__)").Trim()
          if ($runtime -ne "0.2.1rc1") {
            throw "Expected runtime 0.2.1rc1, got $runtime"
          }
          $metadata = (python -c "from importlib.metadata import version; print(version('ai-automatic-video-composer'))").Trim()
          if ($metadata -ne "0.2.1rc1") {
            throw "Expected metadata 0.2.1rc1, got $metadata"
          }

      - name: Ensure real FFmpeg and ffprobe
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "ffmpeg is required for the v0.2.1 RC gate"
          }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw "ffprobe is required for the v0.2.1 RC gate"
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Compile
        run: python -m compileall -q src

      - name: Ruff
        run: python -m ruff check src tests

      - name: Strict mypy
        run: python -m mypy src/aavc

      - name: Full technical Windows acceptance
        run: python -m pytest -m "not visual" -q

      - name: Generate 10 100 500 Scene benchmark evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/rc | Out-Null
          python scripts/benchmark_v2_render.py | Set-Content artifacts/rc/render_benchmark.json -Encoding utf8
          $benchmark = Get-Content artifacts/rc/render_benchmark.json -Raw | ConvertFrom-Json
          $counts = @($benchmark | ForEach-Object { $_.scene_count })
          foreach ($expected in @(10, 100, 500)) {
            if ($counts -notcontains $expected) {
              throw "Missing benchmark result for $expected Scenes"
            }
          }
          Get-Content artifacts/rc/render_benchmark.json

      - name: Capture STEP09 actual UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_step09_ui.py

      - name: Verify STEP09 screenshots
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/step09_actual/*.png
          if ($files.Count -ne 8) {
            throw "Expected 8 STEP09 screenshots, found $($files.Count)"
          }
          $tooSmall = $files | Where-Object { $_.Length -lt 1000 }
          if ($tooSmall) {
            throw "One or more STEP09 screenshots are unexpectedly small"
          }

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1

      - name: Launch packaged EXE and capture real UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = Resolve-Path "dist/AI Automatic Video Composer/AI Automatic Video Composer.exe"
          $capture = Join-Path (Resolve-Path "artifacts/rc") "PACKAGED_UI_002.png"
          $process = Start-Process -FilePath $exe -ArgumentList @(
            "--ui-state", "UI-002",
            "--capture-path", $capture
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged EXE UI launch failed with exit code $($process.ExitCode)"
          }
          if (-not (Test-Path $capture)) {
            throw "Packaged EXE did not produce RC UI capture"
          }
          $file = Get-Item $capture
          if ($file.Length -lt 1000) {
            throw "Packaged RC UI capture is unexpectedly small: $($file.Length)"
          }
          $file | Select-Object FullName, Length

      - name: Prepare 0.2.1rc1 bundle and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $portable = "release/AI-Automatic-Video-Composer-0.2.1-rc1-win64.zip"
          $source = "release/AI-Automatic-Video-Composer-0.2.1-rc1-source.zip"
          if (Test-Path $portable) { Remove-Item $portable -Force }
          if (Test-Path $source) { Remove-Item $source -Force }

          Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath $portable -CompressionLevel Optimal
          git archive --format=zip --output=$source HEAD

          Copy-Item RELEASE_NOTES_0.2.1_RC1.md release/RELEASE_NOTES_0.2.1_RC1.md
          Copy-Item docs/V2_0.2.1_RC1_USER_TEST.md release/V2_0.2.1_RC1_USER_TEST.md
          Copy-Item MAINTENANCE.md release/MAINTENANCE.md
          Copy-Item BACKUP_AND_RECOVERY.md release/BACKUP_AND_RECOVERY.md
          Copy-Item artifacts/rc/render_benchmark.json release/render_benchmark.json
          Copy-Item artifacts/rc/PACKAGED_UI_002.png release/PACKAGED_UI_002.png

          $commit = (git rev-parse HEAD).Trim()
          "release_commit=$commit" | Set-Content release/BUILD_INFO.txt -Encoding utf8
          "version=0.2.1rc1" | Add-Content release/BUILD_INFO.txt -Encoding utf8
          "channel=release-candidate" | Add-Content release/BUILD_INFO.txt -Encoding utf8
          "project_schema_max=4" | Add-Content release/BUILD_INFO.txt -Encoding utf8
          "animation_contract=advanced-v1" | Add-Content release/BUILD_INFO.txt -Encoding utf8
          "final_release=false" | Add-Content release/BUILD_INFO.txt -Encoding utf8

          @"
          V2 0.2.1 RC GATE
          source_commit=$commit
          version=0.2.1rc1
          t0_static_dependency=PASS
          t1_deterministic_unit=PASS
          t2_real_ffmpeg=PASS
          t3_integration_acceptance=PASS
          t4_portable_packaged=PASS
          t5_performance_parity_suite=PASS
          t6_release_reproducibility=PASS
          final_v0.2.1_publication=BLOCKED
          "@ | Set-Content release/RC_GATE_EVIDENCE.txt -Encoding utf8

          $files = @($portable, $source)
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $sumLines | Set-Content release/SHA256SUMS.txt -Encoding utf8

          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            $parts = $line -split "\s+", 2
            $expected = $parts[0]
            $name = $parts[1]
            $actual = (Get-FileHash (Join-Path release $name) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $name"
            }
            Write-Host "$name SHA256=$actual"
          }

          Get-ChildItem release | Select-Object Name, Length

      - name: Upload 0.2.1rc1 candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-0.2.1-rc1-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload 0.2.1rc1 STEP09 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-0.2.1-rc1-step09-ui
          path: artifacts/step09_actual/*.png
          if-no-files-found: error
          retention-days: 30
