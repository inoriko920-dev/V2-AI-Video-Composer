name: Historical Verification — V2 0.2.1

on:
  workflow_dispatch:

concurrency:
  group: historical-v2-0.2.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-published-v0-2-1:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout canonical published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: eb94efebf142ba8203dfc3ae3c5fa861222a0926

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: 'pip'

      - name: Verify frozen release identity
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne "eb94efebf142ba8203dfc3ae3c5fa861222a0926") {
            throw "Historical v0.2.1 verifier checked out unexpected commit $commit"
          }

      - name: Reject committed secrets
        run: python scripts/check_no_secrets.py

      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Verify dependency graph
        run: python -m pip check

      - name: Verify published version
        shell: pwsh
        run: |
          $runtime = (python -c "from aavc import __version__; print(__version__)").Trim()
          if ($runtime -ne "0.2.1") { throw "Expected runtime 0.2.1, got $runtime" }
          $metadata = (python -c "from importlib.metadata import version; print(version('ai-automatic-video-composer'))").Trim()
          if ($metadata -ne "0.2.1") { throw "Expected metadata 0.2.1, got $metadata" }

      - name: Compile
        run: python -m compileall -q src

      - name: Ruff
        run: python -m ruff check src tests

      - name: Strict mypy
        run: python -m mypy src/aavc

      - name: Regression tests
        run: python -m pytest -m "not integration and not visual and not e2e" -q

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1

      - name: Historical verification notice
        shell: pwsh
        run: |
          Write-Host "v0.2.1 is already published and immutable."
          Write-Host "Canonical tag/release commit: eb94efebf142ba8203dfc3ae3c5fa861222a0926"
          Write-Host "Canonical publication workflow: 37643499394"
          Write-Host "This workflow is verification-only and has no contents:write permission."
