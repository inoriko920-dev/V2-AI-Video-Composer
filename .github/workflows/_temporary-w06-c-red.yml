name: Temporary W06-C RED-first Evidence
on:
  push:
    branches:
      - v2/0.3.0-w06-c-recovery-transactions
permissions:
  contents: read
jobs:
  test-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==9.1.1'
      - name: Run transaction RED before implementation
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/integration/test_v2_0_3_0_w06_c_recovery_transactions.py
