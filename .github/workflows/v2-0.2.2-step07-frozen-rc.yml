name: STEP07 V2 0.2.2 Frozen-Source RC Validation (NO PUBLISH)

on:
  push:
    branches:
      - release/v0.2.2-step07-rc-validation

permissions:
  contents: read

concurrency:
  group: step07-v2-0-2-2-frozen-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-check:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 607fb5b59f6788892b60027d736cf99b8898c6a7
      - name: Verify frozen source commit and immutable prior tag
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "607fb5b59f6788892b60027d736cf99b8898c6a7") {
            throw "RC gate checkout mismatch $actual"
          }
          git fetch --no-tags origin "refs/tags/v0.2.1:refs/tags/v0.2.1"
          if ($LASTEXITCODE -ne 0) { throw "Historical stable tag missing" }
          $stable = (git rev-parse refs/tags/v0.2.1).Trim()
          if ($stable -ne "eb94efebf142ba8203dfc3ae3c5fa861222a0926") {
            throw "Historical stable tag changed"
          }
          $existing = (git ls-remote --tags origin refs/tags/v0.2.2)
          if ($LASTEXITCODE -ne 0 -or $existing) { throw "v0.2.2 tag unexpectedly present; stop RC" }
          Write-Host "STEP07_RC_FROZEN_SOURCE_PASS=$actual"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: 'pip'
      - name: Ensure new v0.2.2 version and no existing release publication
        shell: pwsh
        run: |
          if ((Select-String -Path pyproject.toml -Pattern '^version = "0.2.2"$').Count -ne 1) { throw "Wrong release version" }
          if (Test-Path "release_candidate_0_2_2") { throw "Dirty candidate folder" }
          Write-Host "V2_0_2_2_NON_PUBLISHING=PASS"
      - name: Ensure candidate has not yet been published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh release view v0.2.2 --json id 2>$null
          if ($LASTEXITCODE -eq 0) { throw "v0.2.2 release unexpectedly exists" }
          Write-Host "STEP07_RC_PUBLICATION_ABSENT_PASS"
      - name: Reject source secrets
        run: python scripts/check_no_secrets.py
      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip check
      - name: Enforce exact reference FFmpeg (not latest)
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Reference FFmpeg installation failed" }
          }
          ./scripts/verify_ffmpeg_reference.ps1 -Mode system
      - name: Compile Ruff and mypy
        run: |
          python -m compileall -q src
          python -m ruff check src tests
          python -m mypy src/aavc
      - name: Full technical and real FFmpeg tests
        run: python -m pytest -m "not visual" -q
      - name: Build onedir and scan distributable
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify packaged EXE
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Prove PATH and temporary app-local FFmpeg precedence
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: ./scripts/verify_ffmpeg_reference.ps1 -Mode both
      - name: Assemble non-published candidate and verify hashes
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: ./scripts/build_v2_0_2_2_candidate.ps1 -Channel rc
      - name: STEP07 real portable special-path smoke matrix
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $archive = (Resolve-Path release_candidate_0_2_2/AI-Automatic-Video-Composer-0.2.2-win64.zip).Path
          $root = Join-Path $env:RUNNER_TEMP "step07-portable-path-matrix"
          New-Item -ItemType Directory -Force $root | Out-Null
          $cases = @(
            "ASCII",
            "folder with spaces",
            "O'Brien project",
            "Ünicode-日本語",
            ("deep-" + ("nested-folder-" * 11))
          )
          $index = 0
          foreach ($case in $cases) {
            $index += 1
            $target = Join-Path $root $case
            Expand-Archive -Path $archive -DestinationPath $target -Force
            $exe = Join-Path $target "AI Automatic Video Composer.exe"
            if (-not (Test-Path $exe)) { throw "Special-path EXE missing in case $index" }
            $marker = Join-Path $root "smoke-case-$index.txt"
            $process = Start-Process -FilePath $exe -ArgumentList @(
              "--foundation-smoke", "--foundation-smoke-file", $marker
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Special-path EXE failed case $index" }
            if ((Get-Content $marker -Raw) -notmatch "AAVC_FOUNDATION_SMOKE_OK") {
              throw "Special-path smoke token missing case $index"
            }
            if ($index -eq 4) {
              $capture = Join-Path $root "special-unicode-UI-002.png"
              $process = Start-Process -FilePath $exe -ArgumentList @(
                "--ui-state", "UI-002", "--capture-path", $capture
              ) -Wait -PassThru
              if ($process.ExitCode -ne 0 -or -not (Test-Path $capture)) {
                throw "Unicode path offscreen UI capture failed"
              }
              if ((Get-Item $capture).Length -lt 1000) { throw "Unicode path UI PNG too small" }
            }
            Write-Host "STEP07_PORTABLE_PATH_CASE_${index}_PASS"
            Remove-Item $target -Recurse -Force
          }
          Write-Host "STEP07_PORTABLE_PATH_MATRIX_PASS=5"
      - name: Record immutable RC evidence
        shell: pwsh
        run: |
          @(
            "step07_gate=RC_CANDIDATE_ONLY",
            "source_commit=607fb5b59f6788892b60027d736cf99b8898c6a7",
            "stable_v0.2.1=eb94efebf142ba8203dfc3ae3c5fa861222a0926",
            "version=0.2.2",
            "platform=windows-latest",
            "project_schema_max=4",
            "animation_contract=advanced-v1",
            "ffmpeg_reference=9.0.2",
            "portable_special_path_cases=5",
            "release_published=false",
            "candidate_hashes=PASS"
          ) | Set-Content release_candidate_0_2_2/STEP07_RC_EVIDENCE.txt -Encoding utf8
      - name: Upload non-published candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-0.2.2-STEP07-FROZEN-RC-NOT-PUBLISHED
          path: release_candidate_0_2_2/*
          if-no-files-found: error
          retention-days: 30
