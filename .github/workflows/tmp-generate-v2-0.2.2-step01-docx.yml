name: Temporary Generate V2 0.2.2 STEP01 DOCX

on:
  push:
    branches:
      - v2/0.2.2-step01-repo-workflow-security
    paths:
      - "docs/v2_0_2_2_planning/01_REPOSITORY_HYGIENE_AND_WORKFLOW_SECURITY_PLAN.md"
      - "docs/v2_0_2_2_planning/_generator/generate_step01_docx.py"
      - ".github/workflows/tmp-generate-v2-0.2.2-step01-docx.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned DOCX dependency
        run: python -m pip install "python-docx==1.2.0"
      - name: Generate STEP 01 DOCX
        run: python docs/v2_0_2_2_planning/_generator/generate_step01_docx.py
      - name: Commit DOCX to planning branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_0_2_2_planning/docx/01_V2_0.2.2_REPOSITORY_HYGIENE_AND_WORKFLOW_SECURITY_PLAN.docx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(v2): generate 0.2.2 STEP 01 DOCX"
          git push origin HEAD:v2/0.2.2-step01-repo-workflow-security
