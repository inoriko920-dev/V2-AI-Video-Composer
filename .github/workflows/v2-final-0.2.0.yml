name: Historical Verification — V2 0.2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-published-v0-2-0:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: c6ad75308d302cd816301a2a7a34ebe7eb4148a7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: 'pip'

      - name: Reject committed secrets
        run: python scripts/check_no_secrets.py

      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Verify frozen release version
        shell: pwsh
        run: |
          $runtime = (python -c "from aavc import __version__; print(__version__)").Trim()
          if ($runtime -ne "0.2.0") { throw "Expected runtime 0.2.0, got $runtime" }
          $metadata = (python -c "from importlib.metadata import version; print(version('ai-automatic-video-composer'))").Trim()
          if ($metadata -ne "0.2.0") { throw "Expected metadata 0.2.0, got $metadata" }

      - name: Compile
        run: python -m compileall -q src

      - name: Ruff
        run: python -m ruff check src tests

      - name: Strict mypy
        run: python -m mypy src/aavc

      - name: Regression tests
        run: python -m pytest -m "not visual" -q

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1

      - name: Prepare historical verification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force historical_release | Out-Null
          $portable = "historical_release/AI-Automatic-Video-Composer-0.2.0-win64.zip"
          Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath $portable -CompressionLevel Optimal
          $hash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          "$hash  $([System.IO.Path]::GetFileName($portable))" | Set-Content historical_release/SHA256SUMS.txt -Encoding utf8
          "release_commit=c6ad75308d302cd816301a2a7a34ebe7eb4148a7" | Set-Content historical_release/BUILD_INFO.txt -Encoding utf8
          "version=0.2.0" | Add-Content historical_release/BUILD_INFO.txt -Encoding utf8
          "status=published-immutable-historical-verification" | Add-Content historical_release/BUILD_INFO.txt -Encoding utf8

      - name: Upload historical verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-0.2.0-historical-verification
          path: historical_release/*
          if-no-files-found: error
          retention-days: 30
