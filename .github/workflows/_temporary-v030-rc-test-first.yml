name: Temporary v0.3.0 RC test-first proof
on:
  push:
    branches:
      - release/v0.3.0-rc-preparation
permissions:
  contents: read
jobs:
  rc-test-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==9.1.1'
      - name: Candidate contract RED or GREEN
        run: python -m pytest -q tests/unit/test_v2_0_3_0_rc_release_contract.py
