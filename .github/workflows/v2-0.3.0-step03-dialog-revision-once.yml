name: One-Shot STEP03-R Three-Dialog Scope Word

on:
  push:
    branches:
      - v2/0.3.0-step03-dialog-only-scope-revision
    paths:
      - .github/workflows/v2-0.3.0-step03-dialog-revision-once.yml
permissions:
  contents: write
concurrency:
  group: one-shot-step03-r-dialog-only-docx
  cancel-in-progress: false
jobs:
  word:
    if: github.repository == 'inoriko920-dev/V2-AI-Video-Composer'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact V2 planning branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v2/0.3.0-step03-dialog-only-scope-revision
          persist-credentials: true
          fetch-depth: 0
      - name: Validate branch and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/v2/0.3.0-step03-dialog-only-scope-revision'
          test "$(git symbolic-ref --short HEAD)" = 'v2/0.3.0-step03-dialog-only-scope-revision'
          test -s docs/v2_0_3_0_planning/03_STEP03_DIALOG_ONLY_UI_SCOPE_REVISION.md
          test -s docs/v2_0_3_0_planning/_generator/generate_step03_dialog_revision_docx.py
          test "$(find docs/v2_0_3_0_planning/prompt_ui_step03_revised -name '*.txt' | wc -l)" -eq 3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Generate and validate detailed Word plan
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python docs/v2_0_3_0_planning/_generator/generate_step03_dialog_revision_docx.py
          WORD=docs/v2_0_3_0_planning/docx/03_V2_0.3.0_DIALOG_ONLY_SCOPE_REVISION.docx
          test -s "$WORD"
          unzip -t "$WORD" | tail -n 2
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          p=Path('docs/v2_0_3_0_planning/docx/03_V2_0.3.0_DIALOG_ONLY_SCOPE_REVISION.docx')
          d=Document(p)
          assert len(d.paragraphs)>=60,(len(d.paragraphs), len(d.tables))
          assert len(d.tables)>=3,(len(d.paragraphs), len(d.tables))
          s='\n'.join(x.text for x in d.paragraphs)+'\n'.join(cell.text for t in d.tables for row in t.rows for cell in row.cells)
          for term in ('UI-REC-DLG-01','UI-REC-DLG-02','UI-REC-DLG-03','UI-013_ACTUAL.png','HARD STOP'):
              assert term in s, term
          for x in sorted(Path('docs/v2_0_3_0_planning/prompt_ui_step03_revised').glob('*.txt')):
              t=x.read_text(encoding='utf-8')
              assert 'HARD STOP' in t and 'Bahasa Indonesia' in t and len(t)>600, x
          print('STEP03_DIALOG_ONLY_DOCX_PASS',len(d.paragraphs),len(d.tables),p.stat().st_size)
          PY
          sha256sum "$WORD"
      - name: Upload planning DOCX for independent visual QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: V2-0.3.0-STEP03-R-THREE-DIALOG-PLAN-ONLY
          path: docs/v2_0_3_0_planning/docx/03_V2_0.3.0_DIALOG_ONLY_SCOPE_REVISION.docx
          retention-days: 5
          if-no-files-found: error
      - name: Commit only Word and retire this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = 'v2/0.3.0-step03-dialog-only-scope-revision'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2_0_3_0_planning/docx/03_V2_0.3.0_DIALOG_ONLY_SCOPE_REVISION.docx
          git rm .github/workflows/v2-0.3.0-step03-dialog-revision-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'docs(v0.3.0): commit detailed STEP03-R Word plan; self-retire workflow'
          git push origin HEAD:refs/heads/v2/0.3.0-step03-dialog-only-scope-revision
