name: V2 0.3.1 Windows Release Candidate Verification (NO PUBLISH)

on:
  push:
    branches:
      - feat/v0.3.1-step02-version-contract-20261008
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-031-rc-verification
  cancel-in-progress: true

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Verify frozen stable releases and untagged v0.3.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((Select-String -Path pyproject.toml -Pattern '^version = "0.3.1"$').Count -ne 1) { throw "Expected v0.3.1 package" }
          if ((Select-String -Path src/aavc/__init__.py -Pattern '^__version__ = "0.3.1"$').Count -ne 1) { throw "Expected v0.3.1 runtime" }
          $stable = (git rev-parse "refs/tags/v0.3.0^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $stable -ne "d5a085fe239763e469ad30e91f526179fe8b2595") { throw "Published v0.3.0 tag changed" }
          $previous = (git rev-parse "refs/tags/v0.2.2^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $previous -ne "eeabf1ffbfac6cbb6cafc82116fc3599bdbc2bef") { throw "Published v0.2.2 tag changed" }
          if (@(git tag --list "v0.3.1") -contains "v0.3.1") { throw "v0.3.1 tag already exists; no new RC" }
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v0.3.1" -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          } -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) { throw "v0.3.1 release already exists; no new RC" }
          if ($response.StatusCode -ne 404) { throw "Cannot rule out v0.3.1 Release: $($response.StatusCode)" }
          Write-Host "V031_UNPUBLISHED_FROZEN_TAGS_PASS"

      - name: Reject committed secrets
        run: python scripts/check_no_secrets.py

      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip check

      - name: Enforce reviewed external FFmpeg 9.0.2
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg reference install failed" }
          }
          ./scripts/verify_ffmpeg_reference.ps1 -Mode system

      - name: Confirm current package identity
        shell: pwsh
        run: |
          $package = (python -c "from importlib.metadata import version; print(version('ai-automatic-video-composer'))").Trim()
          $runtime = (python -c "from aavc import __version__; print(__version__)").Trim()
          if ($package -ne "0.3.1" -or $runtime -ne "0.3.1") {
            throw "Candidate metadata mismatch package=$package runtime=$runtime"
          }

      - name: Compile Ruff and strict mypy
        run: |
          python -m compileall -q src
          python -m ruff check src tests
          python -m mypy src/aavc

      - name: Full nonvisual regression tests
        run: python -m pytest -m "not visual" -q

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable EXE and files
        shell: pwsh
        run: ./scripts/verify_portable.ps1

      - name: Verify portable five-path matrix
        shell: pwsh
        run: ./scripts/verify_v2_0_3_1_portable_paths.ps1

      - name: Launch packaged EXE and capture real UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force artifacts/rc031 | Out-Null
          $exe = Resolve-Path "dist/AI Automatic Video Composer/AI Automatic Video Composer.exe"
          $out = Join-Path (Resolve-Path "artifacts/rc031") "PACKAGED_UI_002.png"
          $proc = Start-Process -FilePath $exe -ArgumentList @("--ui-state", "UI-002", "--capture-path", ('"' + $out + '"')) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Packaged UI launch failed" }
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) { throw "Real screenshot missing" }

      - name: Verify external FFmpeg and local override
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: ./scripts/verify_ffmpeg_reference.ps1 -Mode both

      - name: Build immutable-source SHA-256 candidate (not released)
        shell: pwsh
        env:
          FFMPEG_REFERENCE: '9.0.2'
        run: ./scripts/build_v2_0_3_1_candidate.ps1 -Channel rc

      - name: Independent ZIP integrity, SHA-256 and negative-path QA
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          python -m scripts.verify_v2_0_3_1_rc_bundle release_candidate_0_3_1 --expected-sha $sourceCommit
          if ($LASTEXITCODE -ne 0) { throw "Independent RC bundle audit failed" }
          python -m pytest tests/unit/test_v2_0_3_1_step04_rc_integrity.py -q
          if ($LASTEXITCODE -ne 0) { throw "Negative-path QA tests failed" }

      - name: Verify exact candidate commit hashes and unchanged v0.3.0 assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "release_candidate_0_3_1"
          $info = Get-Content "$bundle/BUILD_INFO.txt" -Raw
          $expected = (git rev-parse HEAD).Trim()
          if (-not $info.Contains("release_commit=$expected")) { throw "Candidate source SHA mismatch" }
          if (-not $info.Contains("version=0.3.1") -or -not $info.Contains("publication_status=READY_FOR_PUBLICATION")) {
            throw "Invalid candidate version or technical readiness"
          }
          foreach ($line in Get-Content "$bundle/SHA256SUMS.txt") {
            $parts = $line.Trim() -split '\s+', 2
            if ($parts.Count -ne 2) { throw "Invalid SHA256 line" }
            $file = Join-Path $bundle $parts[1]
            if (-not (Test-Path $file)) { throw "Missing checksum target" }
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Candidate checksum mismatch" }
          }
          $release = (gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v0.3.0") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease -or @($release.assets).Count -ne 9) {
            throw "Published v0.3.0 release assets changed"
          }
          $expectedDigests = @{
            "AI-Automatic-Video-Composer-0.3.0-win64.zip" = "sha256:066312fe6c983c797939fccf5682f5f4867c6ba528a099d18e67f33a8e1c7681"
            "AI-Automatic-Video-Composer-0.3.0-source.zip" = "sha256:063c3fa88c03972fdcadcf6c3a7d7c7b183df07b146710cd209a59cbb11ca9df"
          }
          foreach ($name in $expectedDigests.Keys) {
            $matches = @($release.assets | Where-Object { $_.name -eq $name })
            if ($matches.Count -ne 1 -or $matches[0].digest -ne $expectedDigests[$name]) {
              throw "Frozen public 0.3.0 checksum changed: $name"
            }
          }
          "RC_VERSION=0.3.1" | Set-Content artifacts/rc031/RC_STATUS.txt
          "RC_SOURCE_SHA=$expected" | Add-Content artifacts/rc031/RC_STATUS.txt
          "PUBLICATION_STATUS=NOT_PUBLISHED" | Add-Content artifacts/rc031/RC_STATUS.txt
          Copy-Item "artifacts/v031_path_matrix/SPECIAL_PATH_MATRIX.txt" "artifacts/rc031/SPECIAL_PATH_MATRIX.txt"
          Write-Host "V031_RC_NONPUBLISHED_SOURCE_AND_SHA_PASS"

      - name: Upload private non-published Windows and source candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-0.3.1-RC-NOT-PUBLISHED
          path: |
            release_candidate_0_3_1/*
            artifacts/rc031/*
          if-no-files-found: error
          retention-days: 14
