name: Temporary W06-D RED-first UI Evidence
on:
  push:
    branches:
      - v2/0.3.0-w06-d-qt-recovery-integration
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install 'pytest==9.1.1' 'PySide6==6.11.2'
      - name: Confirm historical RED before implementation and return to final head
        shell: bash
        run: |
          git checkout --detach c540f806fae0d6e9682e67a03d7af2e01dcb81a2
          set +e
          python -m pytest -q tests/unit/test_v2_0_3_0_w06_d_recovery_ui.py > /tmp/w06d-red.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            cat /tmp/w06d-red.log
            echo 'Expected W06-D RED but collection succeeded'
            exit 1
          fi
          if ! grep -q 'aavc.presentation.dialogs.recovery_choice' /tmp/w06d-red.log; then
            cat /tmp/w06d-red.log
            echo 'Expected absent Qt dialog module; different failure'
            exit 1
          fi
          echo 'RED PASS: missing recovery dialog at test-only historical commit'
          git checkout --detach "$GITHUB_SHA"
      - name: Assert W06-D GREEN at final head
        run: python -m pytest -q tests/unit/test_v2_0_3_0_w06_d_recovery_ui.py
